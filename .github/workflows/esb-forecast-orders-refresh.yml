name: Sinkronisasi pesanan & penjualan (tiap jam)
on:
  schedule:
    # Tiap jam, 24 JAM PENUH (bukan cuma jam kerja 08-22 WIB lagi -- lihat catatan 2026-11-08
    # di bawah). Dua tujuan:
    # 1) Pesanan yang baru dicatat tim di sheet PESANAN siang/sore hari H-1 sudah ikut
    #    ter-autofill saat forecaster bikin rencana malam itu juga, bukan menunggu
    #    sinkronisasi penuh jam 21.02 WIB.
    # 2) Omzet real (penjualan ESB) ditarik ULANG tiap jam untuk jendela 7 hari TERAKHIR
    #    YANG SUDAH SELESAI (bukan hari ini -- lihat guard ALLOW_TODAY di pcs-sales.mjs,
    #    sengaja TIDAK diset di sini) -- supaya kalau laporan ESB gagal/kepotong sebagian
    #    saat sinkronisasi malam, ada banyak kesempatan sepanjang hari untuk menarik ulang &
    #    memperbaiki, bukan cuma 2x percobaan jam 21.02-21.07 lalu macet sampai besok malam.
    #
    # CATATAN (2026-11-08, dicek owner): riwayat run NYATA menunjukkan jadwal "tiap jam" ini
    # TIDAK benar-benar jalan tiap jam -- cuma 5x terjadi dalam ~49 jam (harusnya ~45x). Ini
    # keterbatasan platform GitHub Actions sendiri: `schedule` adalah best-effort, bukan
    # terjamin, dan GitHub SENDIRI mendokumentasikan jadwal yang jatuh tepat di awal jam
    # (menit :00) paling sering tertunda/terlewat karena itu titik tersibuk semua workflow di
    # seluruh GitHub. Menit digeser ke :11 (bukan solusi sempurna -- GitHub tetap tidak
    # menjamin SLA untuk schedule -- tapi mengurangi kemungkinan tertunda/terlewat). Karena
    # pcs-sales.mjs menggabung (merge), bukan menimpa, dan selalu menarik ulang jendela 7 hari
    # terakhir, keterlambatan di sini tetap self-heal begitu SALAH SATU run berikutnya jalan.
    #
    # Sebelumnya dibatasi 08-22 WIB saja -- itu sebabnya omzet semalam kadang masih belum
    # ter-update kalau dicek pagi-pagi (08.00-22.00 WIB adalah jendela PERTAMA kali ada
    # percobaan terjadwal, jadi kalau ketiga percobaan malam di esb-forecast-refresh.yml gagal
    # semua, tidak ada yang mencoba lagi sampai siang). Diperluas 24 jam penuh karena repo ini
    # PUBLIC -- runner ubuntu-latest GitHub Actions GRATIS TANPA BATAS untuk repo public, jadi
    # tidak ada risiko biaya/kuota menjalankan ini tiap jam sepanjang hari.
    - cron: '11 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # Grup SAMA dengan esb-forecast-refresh.yml (sinkronisasi malam) -- keduanya menulis ke
  # bundle Firestore yang sama (forecastPlans/reference_current). cancel-in-progress:false
  # supaya kalau kebetulan tumpang tindih (mis. 21.00 WIB dekat 21.02 WIB), keduanya tetap
  # jalan berurutan, bukan saling membatalkan atau balapan menulis bundle.
  group: forecast-reference-sync
  cancel-in-progress: false
jobs:
  sync-orders-and-sales:
    runs-on: ubuntu-latest
    # 30, bukan 20: tarikan lost sales dari tab "Rekap Forecast <bulan>" (sheet tim) butuh
    # beberapa menit (tab berat, lihat MONTH_TAB_TIMEOUT_MS di waste-recap.mjs).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baca link sumber yang disimpan tim
        run: node integration/pcs-source.mjs
      - name: Siapkan pcs-sales.json dari bundle live (basis merge, bukan snapshot repo)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs prime
      - name: Tarik pesanan terbaru dari sheet
        run: python integration/pcs_orders.py
      - name: Tarik ulang penjualan ESB 7 hari terakhir yang sudah selesai (bukan hari ini)
        env:
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
        # Tanpa DATE_FROM/DATE_TO/ALLOW_TODAY -- pcs-sales.mjs otomatis memakai jendela
        # default (7 hari sampai KEMARIN) dan menolak menarik hari ini (lihat baris guard
        # "Hanya tanggal yang sudah selesai boleh ditarik" di pcs-sales.mjs). mergeSales
        # MENGGABUNG, bukan menimpa -- jadi aman dipanggil berkali-kali sepanjang hari.
        # Gagal di sini TIDAK menggagalkan langkah pesanan di atas (sudah tersimpan ke
        # pcs-orders.json) -- kalau penjualan gagal, bundle tetap dipaketkan dari pcs-sales.json
        # hasil "prime" (live, tidak berkurang), coba lagi jam berikutnya.
        run: node integration/pcs-sales.mjs || echo "::warning::Penarikan ulang penjualan jam ini belum berhasil sepenuhnya; dicoba lagi jam berikutnya."
      - name: Paketkan & simpan ke bundle referensi privat (bukan file publik)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          # Baca sheet rekap (waste/lost sales) lewat Google Sheets API -- lihat fetchSheetRows di
          # integration/waste-recap.mjs. Kalau secret belum ada, otomatis jatuh ke ekspor gviz lama.
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: node integration/pack-forecast-reference.mjs
