name: Periksa padanan menu PCS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Periksa label menu dan jumlah agregat tanpa data pelanggan
        env:
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
        run: node integration/pcs-menu-probe.mjs
