name: Probe data member (sekali pakai, read-only)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baca ringkasan collection users (read-only, tanpa data pribadi)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/customer-demographics-probe.mjs > probe-output.txt 2>&1 || true
      - name: Simpan hasil sebagai artifact (bukan file publik, bukan commit ke repo)
        uses: actions/upload-artifact@v4
        with:
          name: customer-demographics-probe
          path: probe-output.txt
          retention-days: 3
