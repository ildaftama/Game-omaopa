name: Pembaruan ESB harian
on:
  schedule:
    # 17.00 UTC = 00.00 WIB (Asia/Jakarta), setiap hari.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      sales_date:
        description: Tanggal penjualan (YYYY-MM-DD, kosong = kemarin WIB)
        required: false
        type: string
      date_from:
        description: Awal penarikan historis (opsional, YYYY-MM-DD)
        required: false
        type: string
      date_to:
        description: Akhir penarikan historis (opsional, maksimal 93 hari)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: esb-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ambil dan simpan laporan
        env:
          SALES_DATE: ${{ inputs.sales_date }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          if [ -n "$DATE_FROM" ] || [ -n "$DATE_TO" ]; then
            if [ -n "$SALES_DATE" ]; then
              echo "Isi satu tanggal atau rentang historis, jangan keduanya."
              exit 1
            fi
            node integration/esb-backfill.mjs "$DATE_FROM" "$DATE_TO"
          elif [ -n "$SALES_DATE" ]; then
            node integration/esb-sync.mjs "$SALES_DATE"
          else
            node integration/esb-daily.mjs
          fi
