name: Probe rangkuman lost sales Oktober (sekali pakai, read-only)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarik & rangkum lost sales harian Oktober 2026 (read-only, sheet publik tim)
        run: node integration/october-lostsales-probe.mjs > probe-output.txt 2>&1 || true
      - name: Simpan hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: october-lostsales-probe
          path: probe-output.txt
          retention-days: 3
