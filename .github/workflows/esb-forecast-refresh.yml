name: Sinkronisasi bundle referensi Forecast (malam)
on:
  schedule:
    # TIGA percobaan, bukan satu -- 14.02/15.02/16.02 UTC = 21.02/22.02/23.02 WIB. Owner
    # melaporkan omzet semalam kadang masih belum update paginya; root cause (dicek 2026-11-08):
    # GitHub Actions `schedule` best-effort, TIDAK ada SLA -- riwayat run nyata menunjukkan
    # jadwal "sekali semalam" ini bisa gagal terpicu sama sekali, dan karena cuma 1x kesempatan,
    # satu kegagalan berarti hari itu TIDAK tertutup sampai sinkronisasi tiap jam esok siang
    # (esb-forecast-orders-refresh.yml, mulai jam 08 WIB) akhirnya menariknya ulang -- itu
    # sebabnya pagi hari terasa "belum update". Ketiga jadwal di sini SEMUA dijaga guard
    # WIB_HOUR>=20 di bawah (lihat langkah "Ambil PCS..."), jadi tiap satu yang benar2 jalan
    # dalam jendela 20.00-23.59 WIB akan menarik hari itu dengan aman (merge, bukan timpa) --
    # kemungkinan SEMUA TIGA gagal jauh lebih kecil daripada kemungkinan satu-satunya gagal.
    - cron: '2 14 * * *'
    - cron: '2 15 * * *'
    - cron: '2 16 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Backfill saja (opsional): tanggal awal YYYY-MM-DD. Kosongkan untuk perilaku normal (hari ini saja).'
        required: false
      backfill_to:
        description: 'Backfill saja (opsional): tanggal akhir YYYY-MM-DD. Wajib diisi kalau backfill_from diisi.'
        required: false
      intraday:
        description: 'Isi 1 untuk tarikan SEMENTARA omzet hari berjalan (jam 18-20 WIB, sebelum outlet tutup). Dipicu otomatis oleh Google Apps Script.'
        required: false
permissions:
  contents: read
concurrency:
  group: forecast-reference-sync
  cancel-in-progress: false
jobs:
  sync:
    # Aktif 2026-11-05: akun FIREBASE_SYNC_EMAIL sudah punya staff/{uid}.master=true (syarat
    # forecastManager()), dan rules (role forecaster, forecastBriefs, fulfillment,
    # settings/forecastSources) sudah dipublikasikan ke project Firestore live. Workflow ini
    # TIDAK menyentuh forecast/pcs-sales.json atau forecast/pcs-orders.json di repo publik dan
    # TIDAK memicu deploy GitHub Pages — ia menulis langsung ke bundle privat Firestore
    # (forecastPlans/reference_current dan forecastBriefs/forecaster_current), terpisah dari
    # esb-pcs.yml yang tetap HOLD.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baca link sumber yang disimpan tim
        run: node integration/pcs-source.mjs
      - name: Siapkan pcs-sales.json dari bundle live (basis merge, bukan snapshot repo)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs prime
      - name: Perbarui pesanan dari sheet
        run: python integration/pcs_orders.py
      - name: Ambil PCS produk dari API ESB (hari ini saja; retry sekali 5 menit kemudian kalau ada yang gagal)
        env:
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
          ALLOW_TODAY: '1'
        run: |
          # Riwayat lama sudah tersimpan (lihat langkah "Siapkan pcs-sales.json" di atas) dan
          # digabung, bukan ditimpa -- jadi tiap malam cukup tarik 1 hari, bukan jendela 7 hari
          # bawaan skrip. ~28 laporan, bukan ~196, jauh lebih cepat. ALLOW_TODAY=1 melonggarkan
          # pengaman "hanya tanggal yang sudah selesai" KHUSUS job ini -- job ini sengaja jalan
          # jam 21.02 WIB, 2 menit setelah semua outlet tutup (21.00), jadi hari itu dianggap
          # sudah tuntas. Caller lain (manual/backfill) tetap seketat sebelumnya.
          #
          # esb-client.mjs sendiri sudah retry otomatis per laporan (3x, untuk error jaringan/
          # server sesaat). Ini lapis kedua: kalau SETELAH itu masih ada outlet yang gagal
          # (exit code 2), tunggu 5 menit lalu tarik ulang hari yang SAMA sekali lagi (jam
          # ~21.07 WIB) -- data yang sudah berhasil di percobaan pertama tetap tersimpan
          # (mergeSales menggabung, tidak menimpa), cuma outlet yang gagal yang diulang lagi.
          DAY=$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date()))")
          WIB_HOUR=$(node -e "console.log(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hour12:false}).format(new Date()))")
          FROM="${{ github.event.inputs.backfill_from }}"
          TO="${{ github.event.inputs.backfill_to }}"
          # Tarikan sementara (owner 2026-11-12): omzet hari berjalan s.d. jam ini, disimpan
          # terpisah (intraday) -- hari itu TIDAK ditandai selesai. Dipicu Apps Script jam 18-20.
          # Owner 2026-11-13: outlet dianggap tutup 20.00 (21.00 hanya saat full shift, jarang).
          # Pemicu "sementara" yang datang jam >= 20 diperlakukan sebagai tarikan FINAL; tarikan
          # final jam 21-23 tetap jalan dan memperbarui outlet yang buka sampai 21.00.
          # Sejak owner 2026-11-13 (pemicu final ~19.05): jam >= 19 sudah dianggap final.
          if [ "${{ github.event.inputs.intraday }}" = "1" ] && [ "$WIB_HOUR" -lt 19 ]; then
            INTRADAY=1 node integration/pcs-sales.mjs || echo "::warning::Tarikan sementara hari ini belum lengkap."
            exit 0
          fi
          # GitHub Actions cron BISA tertunda jauh dari jadwal (pernah lebih dari 6 jam) --
          # kalau run ini ternyata baru benar-benar jalan dini hari (bukan ~21.02 WIB seperti
          # seharusnya), "$DAY" dari new Date() sudah berganti ke HARI BARU yang BARU MULAI
          # (belum ada transaksi sama sekali). Menariknya dengan ALLOW_TODAY di jam seperti itu
          # akan salah menandai hari itu "terverifikasi kosong & selesai" (lihat verifiedZero di
          # pcs-sales.mjs) -- padahal cuma belum mulai. Pengaman: HANYA tarik hari berjalan kalau
          # run ini benar-benar terjadi jam 20.00-23.59 WIB (dekat jadwal asli 21.02 WIB).
          if [ -z "$FROM" ]; then
            # >= 21 (bukan 20): outlet tutup 21.00. Sejak 2026-11-12 jam 18-20 ditarik sebagai
            # data sementara (input intraday), jadi tarikan "final" tidak boleh sebelum tutup.
            # >= 20: outlet umumnya tutup 20.00 (owner 2026-11-13).
            if [ "$WIB_HOUR" -ge 19 ]; then
              FROM="$DAY"; TO="$DAY"
            else
              echo "::warning::Run ini jalan jam ${WIB_HOUR}:xx WIB, jauh dari jadwal 21.02 WIB (kemungkinan tertunda GitHub Actions sampai lewat tengah malam). Melewati tarikan hari berjalan supaya tidak salah menandai hari yang baru mulai sebagai 'selesai & kosong'. Hari ini akan tertarik lewat sinkronisasi tiap jam di siang hari atau sinkronisasi malam berikutnya."
            fi
          fi
          if [ -z "$FROM" ]; then
            echo "Tidak ada tanggal yang ditarik pada run ini (lihat peringatan di atas)."
          else
            echo "Tanggal ditarik: $FROM sampai $TO"
            for attempt in 1 2; do
              set +e
              DATE_FROM="$FROM" DATE_TO="$TO" node integration/pcs-sales.mjs
              result=$?
              set -e
              if [ "$result" -eq 0 ]; then
                echo "Semua outlet lengkap pada percobaan ke-$attempt."
                break
              elif [ "$result" -eq 2 ]; then
                if [ "$attempt" -eq 1 ]; then
                  echo "::warning::Sebagian laporan belum terbaca pada percobaan pertama. Coba lagi dalam 5 menit."
                  sleep 300
                else
                  echo "::warning::Sebagian laporan masih belum terbaca setelah percobaan kedua. Snapshot sebelumnya dipertahankan untuk outlet tersebut."
                fi
              else
                exit "$result"
              fi
            done
          fi
      - name: Paketkan & simpan ke bundle referensi privat (bukan file publik)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          # Baca sheet rekap (waste/lost sales) lewat Google Sheets API -- lihat fetchSheetRows di
          # integration/waste-recap.mjs. Kalau secret belum ada, otomatis jatuh ke ekspor gviz lama.
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: node integration/pack-forecast-reference.mjs
