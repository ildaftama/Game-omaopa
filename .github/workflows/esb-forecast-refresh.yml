name: Sinkronisasi bundle referensi Forecast (malam)
on:
  schedule:
    # 14.02 UTC = 21.02 WIB (Asia/Jakarta), setiap hari -- 2 menit setelah outlet tutup (21.00).
    - cron: '2 14 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: forecast-reference-sync
  cancel-in-progress: false
jobs:
  sync:
    # Aktif 2026-11-05: akun FIREBASE_SYNC_EMAIL sudah punya staff/{uid}.master=true (syarat
    # forecastManager()), dan rules (role forecaster, forecastBriefs, fulfillment,
    # settings/forecastSources) sudah dipublikasikan ke project Firestore live. Workflow ini
    # TIDAK menyentuh forecast/pcs-sales.json atau forecast/pcs-orders.json di repo publik dan
    # TIDAK memicu deploy GitHub Pages — ia menulis langsung ke bundle privat Firestore
    # (forecastPlans/reference_current dan forecastBriefs/forecaster_current), terpisah dari
    # esb-pcs.yml yang tetap HOLD.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baca link sumber yang disimpan tim
        run: node integration/pcs-source.mjs
      - name: Siapkan pcs-sales.json dari bundle live (basis merge, bukan snapshot repo)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs prime
      - name: Perbarui pesanan dari sheet
        run: python integration/pcs_orders.py
      - name: Ambil PCS produk dari API ESB (hari ini saja; retry sekali 5 menit kemudian kalau ada yang gagal)
        env:
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
          ALLOW_TODAY: '1'
        run: |
          # Riwayat lama sudah tersimpan (lihat langkah "Siapkan pcs-sales.json" di atas) dan
          # digabung, bukan ditimpa -- jadi tiap malam cukup tarik 1 hari, bukan jendela 7 hari
          # bawaan skrip. ~28 laporan, bukan ~196, jauh lebih cepat. ALLOW_TODAY=1 melonggarkan
          # pengaman "hanya tanggal yang sudah selesai" KHUSUS job ini -- job ini sengaja jalan
          # jam 21.02 WIB, 2 menit setelah semua outlet tutup (21.00), jadi hari itu dianggap
          # sudah tuntas. Caller lain (manual/backfill) tetap seketat sebelumnya.
          #
          # esb-client.mjs sendiri sudah retry otomatis per laporan (3x, untuk error jaringan/
          # server sesaat). Ini lapis kedua: kalau SETELAH itu masih ada outlet yang gagal
          # (exit code 2), tunggu 5 menit lalu tarik ulang hari yang SAMA sekali lagi (jam
          # ~21.07 WIB) -- data yang sudah berhasil di percobaan pertama tetap tersimpan
          # (mergeSales menggabung, tidak menimpa), cuma outlet yang gagal yang diulang lagi.
          DAY=$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date()))")
          echo "Tanggal ditarik: $DAY"
          for attempt in 1 2; do
            set +e
            DATE_FROM="$DAY" DATE_TO="$DAY" node integration/pcs-sales.mjs
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              echo "Semua outlet lengkap pada percobaan ke-$attempt."
              break
            elif [ "$result" -eq 2 ]; then
              if [ "$attempt" -eq 1 ]; then
                echo "::warning::Sebagian laporan belum terbaca pada percobaan pertama. Coba lagi dalam 5 menit."
                sleep 300
              else
                echo "::warning::Sebagian laporan masih belum terbaca setelah percobaan kedua. Snapshot sebelumnya dipertahankan untuk outlet tersebut."
              fi
            else
              exit "$result"
            fi
          done
      - name: Paketkan & simpan ke bundle referensi privat (bukan file publik)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs
