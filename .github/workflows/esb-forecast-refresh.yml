name: Sinkronisasi bundle referensi Forecast (malam)
on:
  schedule:
    # 14.00 UTC = 21.00 WIB (Asia/Jakarta), setiap hari.
    - cron: '0 14 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: forecast-reference-sync
  cancel-in-progress: false
jobs:
  sync:
    # Aktif 2026-11-05: akun FIREBASE_SYNC_EMAIL sudah punya staff/{uid}.master=true (syarat
    # forecastManager()), dan rules (role forecaster, forecastBriefs, fulfillment,
    # settings/forecastSources) sudah dipublikasikan ke project Firestore live. Workflow ini
    # TIDAK menyentuh forecast/pcs-sales.json atau forecast/pcs-orders.json di repo publik dan
    # TIDAK memicu deploy GitHub Pages — ia menulis langsung ke bundle privat Firestore
    # (forecastPlans/reference_current dan forecastBriefs/forecaster_current), terpisah dari
    # esb-pcs.yml yang tetap HOLD.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baca link sumber yang disimpan tim
        run: node integration/pcs-source.mjs
      - name: Siapkan pcs-sales.json dari bundle live (basis merge, bukan snapshot repo)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs prime
      - name: Perbarui pesanan dari sheet
        run: python integration/pcs_orders.py
      - name: Ambil PCS produk dari API ESB (1 hari terakhir yang sudah selesai saja)
        env:
          ESB_USERNAME: ${{ secrets.ESB_USERNAME }}
          ESB_PASSWORD: ${{ secrets.ESB_PASSWORD }}
        run: |
          # Riwayat lama sudah tersimpan (lihat langkah "Siapkan pcs-sales.json" di atas) dan
          # digabung, bukan ditimpa -- jadi tiap malam cukup tarik 1 hari (kemarin WIB, hari
          # yang sudah pasti selesai), bukan jendela 7 hari bawaan skrip. ~28 laporan, bukan
          # ~196, jauh lebih cepat.
          DAY=$(node -e "console.log(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date(Date.now()-86400000)))")
          echo "Tanggal ditarik: $DAY"
          set +e
          DATE_FROM="$DAY" DATE_TO="$DAY" node integration/pcs-sales.mjs
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::Sebagian laporan belum terbaca. Snapshot sebelumnya dipertahankan untuk tanggal tersebut."
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Paketkan & simpan ke bundle referensi privat (bukan file publik)
        env:
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node integration/pack-forecast-reference.mjs
